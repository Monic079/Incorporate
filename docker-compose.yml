version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: incorporate_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: incorporate
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  empresas:
    build: ./docker/php
    container_name: empresas_app
    volumes:
      - ./empresas:/var/www/html
    depends_on:
      - mysql

  alumnos:
    build: ./docker/php
    container_name: alumnos_app
    volumes:
      - ./alumnos:/var/www/html
    depends_on:
      - mysql

  admin:
    build: ./docker/php
    container_name: admin_app
    volumes:
      - ./admin:/var/www/html
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    container_name: proxy
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - empresas
      - alumnos
      - admin

volumes:
  db_data: